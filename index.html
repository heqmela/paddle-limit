<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paddle Limit Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }

    #panel {
      position: absolute;
      z-index: 1000;
      top: 12px;
      left: 12px;
      width: 280px;
      max-width: calc(100vw - 24px);
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,.25);
      overflow: hidden;
    }
    #panel .header {
      background: linear-gradient(135deg, #0a3d62, #0066ff);
      color: #fff;
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 700;
    }
    #panel .body { padding: 14px 16px; }

    .row { margin-bottom: 12px; }
    label { font-size: 13px; color: #333; display: block; margin-bottom: 4px; }
    select, input[type="range"] { width: 100%; }
    #distVal { font-weight: 700; color: #c0392b; }

    button {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 9px;
      background: #0066ff;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { background: #0050cc; }

    #status { font-size: 13px; margin-top: 10px; text-align: center; min-height: 18px; }
    .inside  { color: #27ae60; font-weight: 700; }
    .outside { color: #c0392b; font-weight: 700; }
    .land    { color: #8e44ad; font-weight: 700; }

    .legend {
      margin-top: 12px;
      font-size: 12px;
      color: #555;
      border-top: 1px solid #eee;
      padding-top: 10px;
    }
    .legend div { display: flex; align-items: center; margin-bottom: 4px; }
    .swatch { width: 16px; height: 10px; margin-right: 8px; border-radius: 2px; }
    .sw-line { border-bottom: 2px dashed red; height: 0; }
    .sw-zone { background: rgba(39,174,96,.25); }

    #map { height: 100vh; width: 100vw; }
  </style>
</head>
<body>
  <div id="panel">
    <div class="header">🛶 Paddle Limit Map</div>
    <div class="body">
      <div class="row">
        <label for="country">Country</label>
        <select id="country"></select>
      </div>
      <div class="row">
        <label for="island">Island</label>
        <select id="island"></select>
      </div>
      <div class="row">
        <label for="dist">Limit: <span id="distVal">200</span> m</label>
        <input id="dist" type="range" min="50" max="500" step="10" value="200" />
      </div>
      <div class="row">
        <button id="locBtn">📍 Show my location</button>
        <div id="status"></div>
      </div>
      <div class="legend">
        <div><span class="swatch sw-line"></span> 200 m limit line</div>
        <div><span class="swatch sw-zone"></span> Within limit (safe to paddle)</div>
      </div>
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@turf/turf/turf.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
