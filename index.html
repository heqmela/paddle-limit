<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paddle 200m Limit</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }

    #panel {
      position: absolute;
      z-index: 1000;
      top: 12px;
      left: 12px;
      right: 12px;
      max-width: 320px;
      background: #ffffff;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.25);
    }

    #panel h1 {
      font-size: 16px;
      margin: 0 0 12px 0;
      color: #0a3d62;
    }

    .row { margin-bottom: 12px; }

    label { font-size: 13px; color: #333; display: block; margin-bottom: 4px; }

    select, input[type="range"] { width: 100%; }

    #distVal { font-weight: 700; color: #c0392b; }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #0066ff;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    button:active { background: #0050cc; }

    #status {
      font-size: 12px;
      margin-top: 8px;
      text-align: center;
    }
    .inside { color: #27ae60; font-weight: 700; }
    .outside { color: #c0392b; font-weight: 700; }

    #map { height: 100vh; width: 100vw; }
  </style>
</head>
<body>
  <div id="panel">
    <h1>Paddle Limit Map</h1>

    <div class="row">
      <label for="country">Island</label>
      <select id="country"></select>
    </div>

    <div class="row">
      <label for="dist">Limit: <span id="distVal">200</span> m</label>
      <input id="dist" type="range" min="50" max="500" step="10" value="200" />
    </div>

    <div class="row">
      <button id="locBtn">Show my location</button>
      <div id="status"></div>
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@turf/turf/turf.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
